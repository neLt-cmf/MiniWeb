[workspace]
resolver = "3"
members = ["apps/miniweb"]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
cmf-wp2-app = { git = "https://github.com/fmctools/cmf-watch-sdk", package = "cmf-wp2-app" }
companion-rpc = { git = "https://github.com/fmctools/apps", package = "companion-rpc" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "s"
lto = true
codegen-units = 1
